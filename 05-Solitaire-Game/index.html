    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  
    <style id="gamezone-return-style">
      .gamezone-home-button{position:fixed;z-index:99999;left:18px;bottom:18px;display:inline-flex;align-items:center;gap:9px;padding:12px 17px;border:1px solid rgba(191,145,255,.62);border-radius:999px;background:linear-gradient(135deg,rgba(39,20,65,.96),rgba(18,22,42,.96));color:#fff;font:600 14px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.32),0 0 20px rgba(155,92,255,.22);backdrop-filter:blur(10px);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
      .gamezone-home-button:hover,.gamezone-home-button:focus-visible{transform:translateY(-3px);border-color:#d9bdff;box-shadow:0 10px 30px rgba(0,0,0,.38),0 0 24px rgba(155,92,255,.4);outline:none;}
      .gamezone-home-button .gzh-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#9b5cff,#ff386d);font-size:16px;}
      @media(max-width:520px){.gamezone-home-button{left:12px;bottom:12px;padding:10px 13px;font-size:12px}.gamezone-home-button .gzh-icon{width:24px;height:24px}}
    </style>
</head>
  <body>
    <div class="wrapper">
      <!-- Level selection -->
      <div id="levelScreen" class="level-screen">
        <h1>Solitaire</h1>
        <p>Choose difficulty</p>
        <div class="level-buttons">
          <button type="button" data-level="easy" class="level-btn">
            <span class="level-name">Easy</span>
            <span class="level-desc">Draw 1 · Unlimited undo · Hints</span>
          </button>
          <button type="button" data-level="medium" class="level-btn">
            <span class="level-name">Medium</span>
            <span class="level-desc">Draw 1 · 5 undos · Hints</span>
          </button>
          <button type="button" data-level="hard" class="level-btn">
            <span class="level-name">Hard</span>
            <span class="level-desc">Draw 3 · No undo · No hints</span>
          </button>
        </div>
      </div>

      <!-- Game screen -->
      <div id="gameScreen" class="game-screen hidden">
        <header class="header">
          <h1>Solitaire</h1>
          <span class="level-badge" id="levelBadge">Easy</span>
          <div class="header-actions">
            <button type="button" id="hintBtn" class="btn btn-ghost" title="Hint">Hint</button>
            <button type="button" id="undoBtn" class="btn btn-ghost" title="Undo">Undo <span id="undoCount"></span></button>
            <button type="button" id="changeLevelBtn" class="btn btn-ghost">Level</button>
            <button type="button" id="newGameBtn" class="btn">New Game</button>
          </div>
        </header>

        <main class="game-container">
          <div class="top-row">
            <div class="stock-wrap">
              <div id="stock" class="pile stock" aria-label="Stock"></div>
              <div id="waste" class="pile waste" aria-label="Waste"></div>
            </div>
            <div id="foundations" class="foundations" aria-label="Foundations"></div>
          </div>
          <div id="tableau" class="tableau" aria-label="Tableau"></div>
        </main>

        <!-- Win overlay -->
        <div id="winOverlay" class="win-overlay hidden">
          <div class="win-box">
            <h2>You win!</h2>
            <p>Congratulations, you completed Solitaire.</p>
            <div class="win-actions">
              <button type="button" id="playAgainBtn" class="btn btn-large">Play Again</button>
              <button type="button" id="changeLevelFromWinBtn" class="btn btn-ghost">Change Level</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  
    <a class="gamezone-home-button" href="../../home.html" aria-label="العودة إلى الشاشة الرئيسية" title="العودة إلى GameZone">
      <span class="gzh-icon" aria-hidden="true">⌂</span>
      <span>الرئيسية GameZone</span>
    </a>
</body>
</html>

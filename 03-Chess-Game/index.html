    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  
    <style id="gamezone-return-style">
      .gamezone-home-button{position:fixed;z-index:99999;left:18px;bottom:18px;display:inline-flex;align-items:center;gap:9px;padding:12px 17px;border:1px solid rgba(191,145,255,.62);border-radius:999px;background:linear-gradient(135deg,rgba(39,20,65,.96),rgba(18,22,42,.96));color:#fff;font:600 14px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.32),0 0 20px rgba(155,92,255,.22);backdrop-filter:blur(10px);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
      .gamezone-home-button:hover,.gamezone-home-button:focus-visible{transform:translateY(-3px);border-color:#d9bdff;box-shadow:0 10px 30px rgba(0,0,0,.38),0 0 24px rgba(155,92,255,.4);outline:none;}
      .gamezone-home-button .gzh-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#9b5cff,#ff386d);font-size:16px;}
      @media(max-width:520px){.gamezone-home-button{left:12px;bottom:12px;padding:10px 13px;font-size:12px}.gamezone-home-button .gzh-icon{width:24px;height:24px}}
    </style>
</head>
  <body>
    <div class="wrapper">
      <!-- Mode selection screen -->
      <div id="modeScreen" class="mode-screen">
        <h1>Chess</h1>
        <p>Choose game mode</p>
        <div class="mode-buttons">
          <button type="button" id="vsFriendBtn" class="mode-btn">
            <span class="mode-icon">👥</span>
            Vs Friend
          </button>
          <button type="button" id="vsAiBtn" class="mode-btn">
            <span class="mode-icon">🤖</span>
            Vs AI
          </button>
        </div>
      </div>

      <!-- Game screen -->
      <div id="gameScreen" class="game-screen hidden">
        <header class="header">
          <h1>Chess</h1>
          <div class="game-info">
            <span class="turn-label" id="turnLabel">White to move</span>
            <span class="mode-badge" id="modeBadge">Vs Friend</span>
            <button type="button" id="newGameBtn" class="btn">New Game</button>
            <button type="button" id="changeModeBtn" class="btn btn-ghost">Change Mode</button>
          </div>
        </header>

        <main class="game-container">
          <div id="board" class="board"></div>
          <div class="promotion-overlay hidden" id="promotionOverlay">
            <p>Promote pawn to:</p>
            <div class="promotion-pieces" id="promotionPieces"></div>
          </div>
        </main>

        <div id="gameOverOverlay" class="game-over-overlay hidden">
          <div class="game-over-box">
            <h2 id="gameOverTitle">Checkmate!</h2>
            <p id="gameOverMessage"></p>
            <button type="button" id="playAgainBtn" class="btn btn-large">Play Again</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  
    <a class="gamezone-home-button" href="../../home.html" aria-label="العودة إلى الشاشة الرئيسية" title="العودة إلى GameZone">
      <span class="gzh-icon" aria-hidden="true">⌂</span>
      <span>الرئيسية GameZone</span>
    </a>
</body>
</html>
